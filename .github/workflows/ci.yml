name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: No runtime dependencies
        run: node -e "const p=require('./package.json');if(Object.keys(p.dependencies||{}).length){console.error('插件必须零依赖');process.exit(1)}"
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Syntax check (host + client)
        run: |
          node --check lib/index.js
          node --check client.js
